name: Update NFL Analytics Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests

      - name: Determine current NFL season
        id: season
        run: |
          MONTH=$(date -u +%m)
          YEAR=$(date -u +%Y)

          if [ "$MONTH" -ge 3 ] && [ "$MONTH" -le 8 ]; then
            SEASON=$((YEAR - 1))
          else
            SEASON=$YEAR
          fi

          echo "Current NFL season: $SEASON"
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"

      - name: Build league data
        run: python build_league_data.py ${{ steps.season.outputs.season }}

      - name: Build player data
        run: python build_player_data.py ${{ steps.season.outputs.season }}

      - name: Build team data
        run: python build_team_data.py ${{ steps.season.outputs.season }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update NFL analytics data"
            git push
          fi
