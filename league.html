<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>StackTheStats | League</title>

<link rel="stylesheet" href="styles.css">

<style>

/* =========================
   LEAGUE PAGE
========================= */

.section-toggle {
    display: flex;
    gap: 8px;
    margin: 20px 0;
}

.section-toggle button {
    background: var(--panel);
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 14px;
    font-weight: 700;
    cursor: pointer;
}

.section-toggle button:hover {
    color: var(--text);
}

.section-toggle button.active {
    color: var(--text);
    border-color: var(--accent);
}

/* =========================
   STAT SELECTOR
========================= */

.metric-select {
    margin-bottom: 20px;
}

.metric-select label {
    display: block;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 7px;
    text-transform: uppercase;
    letter-spacing: .4px;
}

.metric-select select {
    min-width: 220px;
}

/* =========================
   LEADERBOARD
========================= */

.leader-title {
    margin: 0 0 5px;
    font-size: 20px;
}

.leader-subtitle {
    margin: 0 0 16px;
    color: var(--muted);
    font-size: 13px;
}

.error {
    color: #ff7b72;
    padding: 10px 0;
}

.loading {
    color: var(--muted);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    .section-toggle {
        width: 100%;
    }

    .section-toggle button {
        flex: 1;
    }

    .metric-select select {
        width: 100%;
    }
}

</style>

</head>

<body>

<div class="site">

    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <a href="index.html" class="brand">
            Stack<span>TheStats</span>
        </a>

        <nav class="nav">

            <a href="index.html">
                HOME
            </a>

            <a href="league.html" class="active">
                LEAGUE
            </a>

            <a href="players.html">
                PLAYERS
            </a>

            <a href="teams.html">
                TEAMS
            </a>

        </nav>

    </header>

    <!-- Keeps existing JavaScript working -->
    <div
        class="season"
        id="season"
        style="display:none;"
    >
        Loading season...
    </div>


    <!-- =========================
         NORMAL / RED ZONE
    ========================= -->

    <div class="section-toggle">

        <button
            id="normalBtn"
            class="active"
            type="button"
        >
            NORMAL
        </button>

        <button
            id="redzoneBtn"
            type="button"
        >
            RED ZONE
        </button>

    </div>


    <!-- =========================
         STAT SELECTOR
    ========================= -->

    <div class="metric-select">

        <label for="metricSelect">
            Stat
        </label>

        <select id="metricSelect">

            <option value="targets">
                Targets
            </option>

            <option value="receptions">
                Receptions
            </option>

            <option value="receiving_yards">
                Receiving Yards
            </option>

            <option value="receiving_tds">
                Receiving TDs
            </option>

            <option value="carries">
                Carries
            </option>

            <option value="rushing_yards">
                Rushing Yards
            </option>

            <option value="rushing_tds">
                Rushing TDs
            </option>

        </select>

    </div>


    <!-- =========================
         LEADERBOARD
    ========================= -->

    <div class="panel">

        <h2
            class="leader-title"
            id="leaderTitle"
        >
            League Leaders
        </h2>

        <p
            class="leader-subtitle"
            id="leaderSubtitle"
        >
            Loading...
        </p>

        <div id="tableWrap">

            <div class="loading">
                Loading league data...
            </div>

        </div>

    </div>

</div>


<script>

/* =========================
   STATE
========================= */

let DATA = null;

let section = "normal";

let metric = "targets";


/* =========================
   ELEMENTS
========================= */

const seasonEl =
    document.getElementById("season");

const normalBtn =
    document.getElementById("normalBtn");

const redzoneBtn =
    document.getElementById("redzoneBtn");

const metricSelect =
    document.getElementById("metricSelect");

const leaderTitle =
    document.getElementById("leaderTitle");

const leaderSubtitle =
    document.getElementById("leaderSubtitle");

const tableWrap =
    document.getElementById("tableWrap");


/* =========================
   NORMAL METRICS
========================= */

const normalMetrics = {

    targets: {
        label: "Targets",
        key: "targets"
    },

    receptions: {
        label: "Receptions",
        key: "receptions"
    },

    receiving_yards: {
        label: "Receiving Yards",
        key: "receiving_yards"
    },

    receiving_tds: {
        label: "Receiving TDs",
        key: "receiving_tds"
    },

    carries: {
        label: "Carries",
        key: "carries"
    },

    rushing_yards: {
        label: "Rushing Yards",
        key: "rushing_yards"
    },

    rushing_tds: {
        label: "Rushing TDs",
        key: "rushing_tds"
    }

};


/* =========================
   RED ZONE METRICS
========================= */

const redzoneMetrics = {

    targets: {
        label: "Red Zone Targets",
        key: "targets"
    },

    receptions: {
        label: "Red Zone Receptions",
        key: "receptions"
    },

    carries: {
        label: "Red Zone Carries",
        key: "carries"
    },

    receiving_tds: {
        label: "Red Zone Receiving TDs",
        key: "receiving_tds"
    },

    rushing_tds: {
        label: "Red Zone Rushing TDs",
        key: "rushing_tds"
    }

};


/* =========================
   LOAD DATA
========================= */

async function loadData() {

    tableWrap.innerHTML =
        '<div class="loading">Loading league data...</div>';

    try {

        const response =
            await fetch(
                "data/league.json?ts=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        DATA = await response.json();

        if (!DATA) {
            throw new Error(
                "No league data found."
            );
        }

        if (DATA.season) {

            seasonEl.textContent =
                `${DATA.season} Season`;

        }

        updateMetricOptions();

        render();

    } catch (error) {

        console.error(error);

        tableWrap.innerHTML = `
            <div class="error">
                Unable to load league data.
            </div>
        `;

        leaderSubtitle.textContent =
            "No league data found.";

    }

}


/* =========================
   UPDATE METRIC OPTIONS
========================= */

function updateMetricOptions() {

    const metrics =
        section === "redzone"
            ? redzoneMetrics
            : normalMetrics;

    metricSelect.innerHTML = "";

    Object.entries(metrics).forEach(
        ([key, value]) => {

            const option =
                document.createElement("option");

            option.value = key;

            option.textContent =
                value.label;

            metricSelect.appendChild(option);

        }
    );

    if (!metrics[metric]) {
        metric =
            Object.keys(metrics)[0];
    }

    metricSelect.value = metric;
}


/* =========================
   GET DATA
========================= */

function getRows() {

    if (!DATA) return [];

    const source =
        section === "redzone"
            ? DATA.red_zone
            : DATA.normal;

    if (!source) return [];

    const metricData =
        source[metric];

    if (Array.isArray(metricData)) {
        return metricData;
    }

    if (metricData &&
        Array.isArray(metricData.players)) {

        return metricData.players;
    }

    if (Array.isArray(source.players)) {

        return source.players;
    }

    if (Array.isArray(source.targets)) {

        return source.targets;
    }

    return [];
}


/* =========================
   RENDER
========================= */

function render() {

    if (!DATA) return;

    const metrics =
        section === "redzone"
            ? redzoneMetrics
            : normalMetrics;

    const metricInfo =
        metrics[metric];

    leaderTitle.textContent =
        "League Leaders";

    leaderSubtitle.textContent =
        `${metricInfo.label} • Top 25`;

    const rows =
        getRows()
            .slice()
            .sort(
                (a, b) =>
                    Number(
                        b[metricInfo.key] || 0
                    )
                    -
                    Number(
                        a[metricInfo.key] || 0
                    )
            )
            .slice(0, 25);

    if (!rows.length) {

        tableWrap.innerHTML = `
            <div class="error">
                No league data found.
            </div>
        `;

        return;
    }

    let html = `
        <table>

            <thead>

                <tr>

                    <th>Rank</th>

                    <th>Player</th>

                    <th>Position</th>

                    <th>${metricInfo.label}</th>

    `;

    if (
        section === "redzone" &&
        metric === "targets"
    ) {

        html += `
                    <th>Share</th>
        `;

    }

    html += `
                </tr>

            </thead>

            <tbody>
    `;


    rows.forEach((row, index) => {

        const playerId =
            row.player_id ||
            row.gsis_id ||
            row.id ||
            "";

        const name =
            row.name ||
            row.display_name ||
            "Unknown";

        const position =
            row.position ||
            "";

        const value =
            Number(
                row[metricInfo.key] || 0
            );


        let shareHtml = "";

        if (
            section === "redzone" &&
            metric === "targets"
        ) {

            const teamTargets =
                Number(
                    row.teamTargets ||
                    row.team_targets ||
                    0
                );

            const share =
                teamTargets > 0
                    ? (value / teamTargets) * 100
                    : 0;

            shareHtml = `
                <td class="share">

                    ${value}/${teamTargets}
                    (${share.toFixed(1)}%)

                    <div class="bar">

                        <div
                            style="width:${Math.min(
                                share,
                                100
                            )}%"
                        ></div>

                    </div>

                </td>
            `;

        }


        const playerLink =
            playerId
                ? `
                    <a
                        class="link"
                        href="player.html?id=${encodeURIComponent(playerId)}"
                    >
                        ${name}
                    </a>
                  `
                : name;


        html += `

            <tr>

                <td class="rank">
                    ${index + 1}
                </td>

                <td>
                    ${playerLink}
                </td>

                <td>
                    ${position}
                </td>

                <td>
                    ${value}
                </td>

                ${shareHtml}

            </tr>

        `;

    });


    html += `

            </tbody>

        </table>

    `;

    tableWrap.innerHTML = html;

}


/* =========================
   NORMAL BUTTON
========================= */

normalBtn.addEventListener(
    "click",
    () => {

        section = "normal";

        normalBtn.classList.add(
            "active"
        );

        redzoneBtn.classList.remove(
            "active"
        );

        metric = "targets";

        updateMetricOptions();

        render();

    }
);


/* =========================
   RED ZONE BUTTON
========================= */

redzoneBtn.addEventListener(
    "click",
    () => {

        section = "redzone";

        redzoneBtn.classList.add(
            "active"
        );

        normalBtn.classList.remove(
            "active"
        );

        metric = "targets";

        updateMetricOptions();

        render();

    }
);


/* =========================
   METRIC CHANGE
========================= */

metricSelect.addEventListener(
    "change",
    () => {

        metric =
            metricSelect.value;

        render();

    }
);


/* =========================
   START
========================= */

loadData();

</script>

</body>
</html>
