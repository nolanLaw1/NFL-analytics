<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Analytics - League</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f1115;
    color: white;
}

nav {
    padding: 15px;
    background: #171a21;
    display: flex;
    gap: 20px;
}

nav a {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 20px;
}

h1 {
    margin-bottom: 5px;
}

.muted {
    color: #9ca3af;
}

.metric {
    margin-top: 30px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #2b3038;
    text-align: left;
}

th {
    background: #171a21;
}

.error {
    color: #ff6b6b;
    padding: 20px;
}
</style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="league.html">League</a>
    <a href="players.html">Players</a>
    <a href="teams.html">Teams</a>
</nav>

<div class="container">

<h1>League Leaders</h1>
<div id="season" class="muted">Loading...</div>

<div id="content"></div>

</div>

<script>
fetch("data/league.json")
.then(response => {
    if (!response.ok) {
        throw new Error("Could not load league.json");
    }
    return response.json();
})
.then(data => {

    document.getElementById("season").textContent =
        data.season + " Season";

    const content = document.getElementById("content");

    const sections = [
        ["Targets", data.targets],
        ["Receptions", data.receptions],
        ["Receiving Yards", data.receiving_yards],
        ["Receiving Touchdowns", data.receiving_tds],
        ["Carries", data.carries],
        ["Rushing Yards", data.rushing_yards],
        ["Rushing Touchdowns", data.rushing_tds]
    ];

    sections.forEach(([title, rows]) => {

        if (!Array.isArray(rows) || rows.length === 0) {
            return;
        }

        const section = document.createElement("div");
        section.className = "metric";

        let html = `<h2>${title}</h2>`;

        html += `
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player</th>
                    <th>Team</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
        `;

        rows.slice(0, 25).forEach((player, index) => {

            html += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${player.name || player.player_name || ""}</td>
                    <td>${player.team || ""}</td>
                    <td>${player.value ?? player.total ?? player.targets ?? ""}</td>
                </tr>
            `;
        });

        html += `
            </tbody>
        </table>
        `;

        section.innerHTML = html;
        content.appendChild(section);
    });

    if (!content.innerHTML) {
        content.innerHTML =
            '<div class="error">League data loaded, but no leader categories were found.</div>';
    }

})
.catch(error => {
    console.error(error);

    document.getElementById("content").innerHTML =
        '<div class="error">Unable to load league data.</div>';
});
</script>

</body>
</html>
