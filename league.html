<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Analytics — League</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="site">

    <div class="brand">
        <h1>NFL Analytics</h1>
        <div class="season" id="season"></div>
    </div>

    <nav class="mainnav">
        <a class="active" href="league.html">LEAGUE</a>
        <a href="players.html">PLAYERS</a>
        <a href="teams.html">TEAMS</a>
    </nav>

    <div class="controls">

        <select id="stat" class="filter">

            <option value="targets">
                Targets
            </option>

            <option value="receptions">
                Receptions
            </option>

            <option value="receiving_yards">
                Receiving Yards
            </option>

            <option value="receiving_tds">
                Receiving TDs
            </option>

            <option value="carries">
                Carries
            </option>

            <option value="rushing_yards">
                Rushing Yards
            </option>

            <option value="rushing_tds">
                Rushing TDs
            </option>

        </select>

    </div>

    <section class="panel">

        <div class="panelhead">

            <h2 id="title">
                Targets
            </h2>

            <div class="note">
                League Leaders
            </div>

        </div>

        <div id="table"></div>

    </section>

    <div class="footer">
        NFL Analytics
    </div>

</div>


<script>

let DATA = {};


const statSelect =
    document.getElementById("stat");

const table =
    document.getElementById("table");

const title =
    document.getElementById("title");


const LABELS = {

    targets:
        "Targets",

    receptions:
        "Receptions",

    receiving_yards:
        "Receiving Yards",

    receiving_tds:
        "Receiving TDs",

    carries:
        "Carries",

    rushing_yards:
        "Rushing Yards",

    rushing_tds:
        "Rushing TDs"

};


function esc(value) {

    return String(value ?? "").replace(
        /[&<>"']/g,
        m => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[m])
    );

}


function numberValue(value) {

    const n = Number(value);

    return Number.isFinite(n)
        ? n
        : 0;

}


function render() {

    const stat =
        statSelect.value;

    const rows =
        Array.isArray(DATA[stat])
            ? [...DATA[stat]]
            : [];


    rows.sort(
        (a, b) =>
            numberValue(b.[stat]) -
            numberValue(a[stat])
    );


    title.textContent =
        LABELS[stat] || stat;


    if (!rows.length) {

        table.innerHTML = `
            <div style="
                padding:20px;
                color:#9aa6b2
            ">
                No data available.
            </div>
        `;

        return;

    }


    const top25 =
        rows.slice(0, 25);


    let html = `

        <table>

            <thead>

                <tr>

                    <th class="rank">
                        #
                    </th>

                    <th>
                        Player
                    </th>

                    <th>
                        Position
                    </th>

                    <th>
                        Team
                    </th>

                    <th>
                        ${esc(
                            LABELS[stat] || stat
                        )}
                    </th>

                </tr>

            </thead>

            <tbody>

    `;


    top25.forEach((player, index) => {

        html += `

            <tr>

                <td class="rank">
                    ${index + 1}
                </td>

                <td>

                    <a
                        class="link"
                        href="player.html?id=${encodeURIComponent(
                            player.player_id || ""
                        )}"
                    >
                        ${esc(player.name)}
                    </a>

                </td>

                <td>
                    ${esc(player.position || "")}
                </td>

                <td>
                    ${esc(player.team || "")}
                </td>

                <td>
                    ${numberValue(player[stat])}
                </td>

            </tr>

        `;

    });


    html += `

            </tbody>

        </table>

    `;


    table.innerHTML = html;

}


statSelect.addEventListener(
    "change",
    render
);


fetch("data/league.json")

.then(response => {

    if (!response.ok) {

        throw new Error(
            "HTTP " + response.status
        );

    }

    return response.json();

})

.then(data => {

    DATA =
        data.normal || {};


    document.getElementById(
        "season"
    ).textContent =
        (data.season || "") +
        " Season";


    render();

})

.catch(error => {

    console.error(error);

    table.innerHTML = `

        <div style="
            padding:20px;
            color:#ff6b6b
        ">

            Unable to load league data:
            ${esc(error.message)}

        </div>

    `;

});

</script>

</body>
</html>
