<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NFL Analytics — Player</title>

<link rel="stylesheet" href="styles.css">

<style>

/* =========================
   PLAYER PAGE
========================= */

.player-header {
    margin-bottom: 24px;
}

.player-header h1 {
    margin: 0 0 6px 0;
}

.player-meta {
    color: #8b949e;
    font-size: 15px;
}


/* =========================
   SITE NAVIGATION
========================= */

.nav {
    display: flex !important;
    align-items: center !important;
    gap: 24px !important;
    margin: 0 0 24px 0 !important;
    padding: 14px 0 !important;
    border-bottom: 1px solid #263241 !important;
}

.nav a {
    color: #8b949e !important;
    text-decoration: none !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    letter-spacing: .03em !important;
}

.nav a:hover {
    color: #ffffff !important;
    text-decoration: none !important;
}

.nav a.active {
    color: #58a6ff !important;
}


/* =========================
   BACK LINK
========================= */

.back-link {
    display: inline-block;
    margin-bottom: 18px;
    color: #58a6ff !important;
    text-decoration: none !important;
    font-size: 14px;
}

.back-link:hover {
    color: #ffffff !important;
    text-decoration: none !important;
}


/* =========================
   STAT CARDS
========================= */

.stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
}

.stat-card {
    background: var(--panel);
    border: 1px solid #263241;
    border-radius: 10px;
    padding: 16px;
}

.stat-card-label {
    color: #8b949e;
    font-size: 12px;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .04em;
}

.stat-card-value {
    font-size: 22px;
    font-weight: 700;
}

.stat-card-sub {
    color: #8b949e;
    font-size: 12px;
    margin-top: 4px;
}


/* =========================
   SECTIONS
========================= */

.section {
    margin-top: 30px;
}

.section h2 {
    margin-bottom: 6px;
}

.section-note {
    color: #8b949e;
    font-size: 13px;
    margin-bottom: 14px;
}


/* =========================
   WEEKLY TABLE
========================= */

.table-wrap {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border: 1px solid #263241;
    border-radius: 10px;
}

.weekly-table {
    width: 100%;
    min-width: 780px;
    border-collapse: collapse;
    background: var(--panel);
}

.weekly-table th,
.weekly-table td {
    padding: 12px 14px;
    text-align: right;
    border-bottom: 1px solid #263241;
    white-space: nowrap;
}

.weekly-table th:first-child,
.weekly-table td:first-child {
    text-align: left;
}

.weekly-table th {
    background: var(--panel2);
    color: #c9d1d9;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .04em;
}

.weekly-table td {
    font-size: 14px;
}

.weekly-table tr:last-child td {
    border-bottom: none;
}

.weekly-table tbody tr:hover {
    background: rgba(255,255,255,.025);
}

.share {
    font-weight: 600;
}


/* =========================
   EMPTY / ERROR
========================= */

.message {
    background: var(--panel);
    border: 1px solid #263241;
    border-radius: 10px;
    padding: 18px;
    color: #8b949e;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .nav {
        gap: 18px !important;
        padding: 12px 0 !important;
    }

    .nav a {
        font-size: 13px !important;
    }

    .stat-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .stat-card {
        padding: 13px;
    }

    .stat-card-value {
        font-size: 19px;
    }

    .player-header h1 {
        font-size: 25px;
    }
}

</style>

<style>
.container {
    padding-left: 28px;
    padding-right: 28px;
}
</style>

</head>

<body>

<div class="container">

    <!-- NAVIGATION -->

    <nav class="nav">

        <a href="league.html">
            LEAGUE
        </a>

        <a href="players.html" class="active">
            PLAYERS
        </a>

        <a href="teams.html">
            TEAMS
        </a>

    </nav>


    <!-- PLAYER CONTENT -->

    <main id="playerContent">

        <div class="message">
            Loading player...
        </div>

    </main>

</div>


<script>

/* =========================
   PLAYER ID
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const playerId =
    params.get("id");

const content =
    document.getElementById("playerContent");


/* =========================
   HELPERS
========================= */

function number(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "0";
    }

    const n = Number(value);

    if (!Number.isFinite(n)) {
        return "0";
    }

    return n.toLocaleString();

}


function percentage(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "0.0%";
    }

    const n = Number(value);

    if (!Number.isFinite(n)) {
        return "0.0%";
    }

    return n.toFixed(1) + "%";

}


/* =========================
   WEEKLY DATA
========================= */

function getWeekly(player) {

    if (Array.isArray(player.weekly)) {
        return player.weekly;
    }

    if (Array.isArray(player.weekly_usage)) {
        return player.weekly_usage;
    }

    return [];

}


/* =========================
   STAT CARD
========================= */

function statCard(
    label,
    value,
    sub = ""
) {

    return `
        <div class="stat-card">

            <div class="stat-card-label">
                ${label}
            </div>

            <div class="stat-card-value">
                ${value}
            </div>

            ${
                sub
                    ? `<div class="stat-card-sub">${sub}</div>`
                    : ""
            }

        </div>
    `;

}


/* =========================
   POSITION STATS
========================= */

function buildStats(player) {

    const position =
        player.position;

    let html =
        `<div class="stat-grid">`;


    /* =========================
       QB
    ========================= */

    if (position === "QB") {

        html += statCard(
            "Pass Attempts",
            number(
                player.attempts ??
                player.passing_attempts
            )
        );

        html += statCard(
            "Pass Yards",
            number(player.passing_yards)
        );

        html += statCard(
            "Pass TDs",
            number(
                player.passing_touchdowns ??
                player.passing_tds
            )
        );

        html += statCard(
            "Completions",
            number(player.completions)
        );

        html += statCard(
            "RZ Pass Attempts",
            number(
                player.red_zone_pass_attempts
            )
        );

        html += statCard(
            "RZ Pass TDs",
            number(
                player.red_zone_pass_touchdowns
            )
        );

        html += statCard(
            "Carries",
            number(player.carries)
        );

        html += statCard(
            "Rush Yards",
            number(player.rushing_yards)
        );

        html += statCard(
            "RZ Carries",
            number(
                player.red_zone_carries ??
                player.red_zone_rushes
            )
        );

    }


    /* =========================
       RB
    ========================= */

    else if (position === "RB") {

        html += statCard(
            "Carries",
            number(player.carries)
        );

        html += statCard(
            "Rush Yards",
            number(player.rushing_yards)
        );

        html += statCard(
            "Rush TDs",
            number(
                player.rushing_touchdowns ??
                player.rushing_tds
            )
        );

        html += statCard(
            "Targets",
            number(player.targets)
        );

        html += statCard(
            "Target Share",
            percentage(player.target_share)
        );

        html += statCard(
            "Receptions",
            number(player.receptions)
        );

        html += statCard(
            "Receiving Yards",
            number(player.receiving_yards)
        );

        html += statCard(
            "Receiving TDs",
            number(
                player.receiving_touchdowns ??
                player.receiving_tds
            )
        );

        html += statCard(
            "RZ Targets",
            number(player.red_zone_targets)
        );

        html += statCard(
            "RZ Target Share",
            percentage(
                player.red_zone_target_share
            )
        );

        html += statCard(
            "RZ Receptions",
            number(
                player.red_zone_receptions
            )
        );

        html += statCard(
            "RZ Receiving Yards",
            number(
                player.red_zone_receiving_yards
            )
        );

        html += statCard(
            "RZ Receiving TDs",
            number(
                player.red_zone_receiving_touchdowns
            )
        );

        html += statCard(
            "RZ Carries",
            number(
                player.red_zone_carries
            )
        );

    }


    /* =========================
       WR / TE
    ========================= */

    else {

        html += statCard(
            "Targets",
            number(player.targets)
        );

        html += statCard(
            "Target Share",
            percentage(player.target_share)
        );

        html += statCard(
            "Receptions",
            number(player.receptions)
        );

        html += statCard(
            "Receiving Yards",
            number(player.receiving_yards)
        );

        html += statCard(
            "Receiving TDs",
            number(
                player.receiving_touchdowns ??
                player.receiving_tds
            )
        );

        html += statCard(
            "RZ Targets",
            number(
                player.red_zone_targets
            )
        );

        html += statCard(
            "RZ Target Share",
            percentage(
                player.red_zone_target_share
            )
        );

        html += statCard(
            "RZ Receptions",
            number(
                player.red_zone_receptions
            )
        );

        html += statCard(
            "RZ Receiving Yards",
            number(
                player.red_zone_receiving_yards
            )
        );

        html += statCard(
            "RZ Receiving TDs",
            number(
                player.red_zone_receiving_touchdowns
            )
        );

        html += statCard(
            "RZ Carries",
            number(
                player.red_zone_carries
            )
        );

    }


    html += `</div>`;

    return html;

}


/* =========================
   WEEKLY TABLE
========================= */

function buildWeeklyTable(player) {

    const weekly =
        getWeekly(player);


    if (!weekly.length) {

        return `
            <div class="message">
                Weekly usage data is not available yet.
            </div>
        `;

    }


    const completedWeeks =
        [...weekly]
            .filter(
                row =>
                    row &&
                    row.week !== undefined
            )
            .sort(
                (a, b) =>
                    Number(a.week) -
                    Number(b.week)
            );


    if (!completedWeeks.length) {

        return `
            <div class="message">
                Weekly usage data is not available yet.
            </div>
        `;

    }


    let rows = "";


    for (const row of completedWeeks) {

        rows += `

            <tr>

                <td>
                    Week ${number(row.week)}
                </td>

                <td>
                    ${number(row.targets)}
                </td>

                <td class="share">
                    ${percentage(row.target_share)}
                </td>

                <td>
                    ${number(row.carries)}
                </td>

                <td>
                    ${number(row.receptions)}
                </td>

                <td>
                    ${number(row.red_zone_targets)}
                </td>

                <td class="share">
                    ${percentage(
                        row.red_zone_target_share
                    )}
                </td>

                <td>
                    ${number(
                        row.red_zone_carries
                    )}
                </td>

            </tr>

        `;

    }


    return `

        <div class="table-wrap">

            <table class="weekly-table">

                <thead>

                    <tr>

                        <th>Week</th>
                        <th>Targets</th>
                        <th>Target Share</th>
                        <th>Carries</th>
                        <th>Receptions</th>
                        <th>RZ Targets</th>
                        <th>RZ Target Share</th>
                        <th>RZ Carries</th>

                    </tr>

                </thead>

                <tbody>

                    ${rows}

                </tbody>

            </table>

        </div>

    `;

}


/* =========================
   LOAD PLAYER
========================= */

async function loadPlayer() {

    if (!playerId) {

        content.innerHTML = `
            <div class="message">
                No player selected.
            </div>
        `;

        return;

    }


    try {

        const response =
            await fetch(
                "data/players.json?ts=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load player data."
            );

        }


        const raw =
            await response.json();


        /*
         * Support both:
         *
         * [ {...}, {...} ]
         *
         * and:
         *
         * {
         *   "season": 2026,
         *   "players": [ ... ]
         * }
         */

        const players =
            Array.isArray(raw)
                ? raw
                : Array.isArray(raw.players)
                    ? raw.players
                    : [];


        const player =
            players.find(
                p =>
                    String(p.player_id) ===
                    String(playerId)
            );


        if (!player) {

            content.innerHTML = `
                <div class="message">
                    Player not found.
                </div>
            `;

            return;

        }


        const playerName =
            player.player_name ||
            player.name ||
            "Unknown Player";


        const position =
            player.position ||
            "";


        const team =
            player.team ||
            "";


        document.title =
            `NFL Analytics — ${playerName}`;


        content.innerHTML = `

            <a
                class="back-link"
                href="players.html"
            >
                ← Back to Players
            </a>


            <div class="player-header">

                <h1>
                    ${playerName}
                </h1>

                <div class="player-meta">

                    ${position}

                    ${
                        position && team
                            ? " • "
                            : ""
                    }

                    ${team}

                </div>

            </div>


            ${buildStats(player)}


            <section class="section">

                <h2>
                    Weekly Usage
                </h2>

                <div class="section-note">
                    Completed regular-season weeks only
                </div>

                ${buildWeeklyTable(player)}

            </section>

        `;

    }


    catch (error) {

        console.error(error);

        content.innerHTML = `

            <div class="message">
                Unable to load player data.
            </div>

        `;

    }

}


/* =========================
   START
========================= */

loadPlayer();

</script>

</body>
</html>
