<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NFL Analytics — Player</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="site">

<div class="brand">
<h1>NFL Analytics</h1>
<div class="season" id="season"></div>
</div>

<nav class="mainnav">
<a href="league.html">LEAGUE</a>
<a class="active" href="players.html">PLAYERS</a>
<a href="teams.html">TEAMS</a>
</nav>

<div id="content"></div>

<div class="footer">
NFL offensive usage • player detail
</div>

</div>

<script>

const id = new URLSearchParams(location.search).get("id");

function esc(value) {
    return String(value ?? "").replace(
        /[&<>"']/g,
        m => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[m])
    );
}

function pct(value) {
    const n = Number(value);
    return Number.isFinite(n) ? n.toFixed(1) + "%" : "0.0%";
}

    return Number(value).toFixed(1) + "%";
}

fetch("data/players.json")

.then(response => {

    if (!response.ok) {
        throw new Error("HTTP " + response.status);
    }

    return response.json();

})

.then(data => {

    const arr = Array.isArray(data)
        ? data
        : (data.players || []);

    const player = arr.find(
        p => String(p.player_id) === String(id)
    );

    document.getElementById("season").textContent =
        (data.season || "") + " Season";

    if (!player) {

        document.getElementById("content").innerHTML = `
            <section class="panel">
                <div class="panelhead">
                    <h2>Player Not Found</h2>
                </div>

                <div style="padding:20px;color:#9aa6b2">
                    We couldn't find this player.
                </div>
            </section>
        `;

        return;
    }

    document.getElementById("content").innerHTML = `

        <section class="panel">

            <div class="panelhead">

                <div>
                    <h2>${esc(player.name)}</h2>

                    <div class="meta">
                        ${esc(player.position)} · ${esc(player.team || "")}
                    </div>
                </div>

            </div>

            <div class="grid" style="padding:18px">

                <div class="card">
                    <div class="meta">Targets</div>
                    <h2>${player.targets ?? 0}</h2>
                </div>

                <div class="card">
                    <div class="meta">Target Share</div>
                    <h2>${pct(player.target_share)}</h2>
                </div>

                <div class="card">
                    <div class="meta">RZ Target Share</div>
                    <h2>${pct(player.red_zone_target_share)}</h2>
                </div>

                <div class="card">
                    <div class="meta">Receptions</div>
                    <h2>${player.receptions ?? 0}</h2>
                </div>

                <div class="card">
                    <div class="meta">Carries</div>
                    <h2>${player.carries ?? 0}</h2>
                </div>

                <div class="card">
                    <div class="meta">Receiving Yards</div>
                    <h2>${player.receiving_yards ?? 0}</h2>
                </div>

                <div class="card">
                    <div class="meta">Rushing Yards</div>
                    <h2>${player.rushing_yards ?? 0}</h2>
                </div>

                <div class="card">
                    <div class="meta">Receiving TDs</div>
                    <h2>${player.receiving_tds ?? 0}</h2>
                </div>

                <div class="card">
                    <div class="meta">Rushing TDs</div>
                    <h2>${player.rushing_tds ?? 0}</h2>
                </div>

                <div class="card">
                    <div class="meta">RZ Targets</div>
                    <h2>${player.red_zone_targets ?? 0}</h2>
                </div>

                <div class="card">
                    <div class="meta">RZ Carries</div>
                    <h2>${player.red_zone_carries ?? 0}</h2>
                </div>

            </div>

        </section>

        <section class="panel" style="margin-top:14px">

            <div class="panelhead">
                <h2>Weekly Usage</h2>
                <div class="note">Regular season</div>
            </div>

            <div id="weekly"></div>

        </section>
    `;

    const weekly =
        player.weekly ||
        player.weekly_usage ||
        [];

    if (!weekly.length) {

        document.getElementById("weekly").innerHTML = `
            <div style="padding:20px;color:#9aa6b2">
                Weekly usage data is not available yet.
            </div>
        `;

        return;
    }

    let html = `
        <table>

            <thead>
                <tr>
                    <th>Week</th>
                    <th>Targets</th>
                    <th>Carries</th>
                    <th class="hide-mobile">Receptions</th>
                    <th class="hide-mobile">RZ Targets</th>
                    <th class="hide-mobile">RZ Carries</th>
                </tr>
            </thead>

            <tbody>
    `;

    weekly.forEach(week => {

        html += `
            <tr>

                <td>${week.week ?? ""}</td>

                <td>${week.targets ?? 0}</td>

                <td>${week.carries ?? 0}</td>

                <td class="hide-mobile">
                    ${week.receptions ?? 0}
                </td>

                <td class="hide-mobile">
                    ${week.red_zone_targets ?? 0}
                </td>

                <td class="hide-mobile">
                    ${week.red_zone_carries ?? 0}
                </td>

            </tr>
        `;

    });

    html += `
            </tbody>

        </table>
    `;

    document.getElementById("weekly").innerHTML = html;

})

.catch(error => {

    console.error(error);

    document.getElementById("content").innerHTML = `
        <section class="panel">

            <div class="panelhead">
                <h2>Player Data Error</h2>
            </div>

            <div style="padding:20px;color:#ff6b6b">
                Unable to load player data.
            </div>

        </section>
    `;

});

</script>

</body>
</html>
