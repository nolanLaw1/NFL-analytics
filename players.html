<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Analytics — Players</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="site">

    <div class="brand">
        <h1>NFL Analytics</h1>
        <div class="season" id="season"></div>
    </div>

    <nav class="mainnav">
        <a href="league.html">LEAGUE</a>
        <a class="active" href="players.html">PLAYERS</a>
        <a href="teams.html">TEAMS</a>
    </nav>

    <div class="controls">

        <input
            id="search"
            class="search"
            placeholder="Search players..."
            autocomplete="off"
            style="flex:1;min-width:180px;"
        >

        <select id="position" class="filter">
            <option value="ALL">All positions</option>
            <option value="QB">QB</option>
            <option value="RB">RB</option>
            <option value="WR">WR</option>
            <option value="TE">TE</option>
        </select>

        <select id="team" class="filter">
            <option value="ALL">All teams</option>
        </select>

    </div>

    <section class="panel">

        <div class="panelhead">
            <h2>Players</h2>

            <div class="note">
                Click a column header to sort
            </div>
        </div>

        <div id="table"></div>

    </section>

    <div class="footer">
        Click a player for detail • Click column headers to sort
    </div>

</div>


<script>

let DATA = [];

let currentSort = "targets";
let sortDirection = "desc";

const search = document.getElementById("search");
const position = document.getElementById("position");
const team = document.getElementById("team");
const table = document.getElementById("table");


/* =========================================================
   COLUMNS
   ========================================================= */

const COLUMNS = [

    {
        key: "name",
        label: "Player",
        type: "text"
    },

    {
        key: "position",
        label: "Position",
        type: "text"
    },

    {
        key: "team",
        label: "Team",
        type: "text"
    },

    /* QB PASSING */

    {
        key: "pass_attempts",
        label: "Pass Attempts",
        type: "number"
    },

    {
        key: "completions",
        label: "Completions",
        type: "number"
    },

    {
        key: "completion_pct",
        label: "Completion %",
        type: "percent"
    },

    {
        key: "passing_yards",
        label: "Passing Yards",
        type: "number"
    },

    {
        key: "passing_tds",
        label: "Passing TDs",
        type: "number"
    },

    {
        key: "interceptions",
        label: "INT",
        type: "number"
    },

    {
        key: "yards_per_attempt",
        label: "Yards/Attempt",
        type: "number"
    },

    {
        key: "red_zone_pass_attempts",
        label: "RZ Pass Attempts",
        type: "number"
    },

    /* RECEIVING */

    {
        key: "targets",
        label: "Targets",
        type: "number"
    },

    {
        key: "receptions",
        label: "Receptions",
        type: "number"
    },

    {
        key: "receiving_yards",
        label: "Receiving Yards",
        type: "number"
    },

    {
        key: "receiving_tds",
        label: "Receiving TDs",
        type: "number"
    },

    /* RUSHING */

    {
        key: "carries",
        label: "Carries",
        type: "number"
    },

    {
        key: "rushing_yards",
        label: "Rushing Yards",
        type: "number"
    },

    {
        key: "rushing_tds",
        label: "Rushing TDs",
        type: "number"
    },

    /* USAGE */

    {
        key: "target_share",
        label: "Target Share",
        type: "percent"
    },

    {
        key: "red_zone_target_share",
        label: "RZ Target Share",
        type: "percent"
    },

    {
        key: "red_zone_rushes",
        label: "RZ Rushes",
        type: "number"
    }

];


/* =========================================================
   POSITION COLUMNS
   ========================================================= */

const POSITION_COLUMNS = {

    ALL: [
        "name",
        "position",
        "team",
        "targets",
        "receptions",
        "receiving_yards",
        "receiving_tds",
        "carries",
        "rushing_yards",
        "rushing_tds",
        "target_share",
        "red_zone_target_share",
        "red_zone_rushes"
    ],

    QB: [
        "name",
        "position",
        "team",

        "pass_attempts",
        "completions",
        "completion_pct",
        "passing_yards",
        "passing_tds",
        "interceptions",
        "yards_per_attempt",
        "red_zone_pass_attempts",

        "carries",
        "rushing_yards",
        "rushing_tds",
        "red_zone_rushes"
    ],

    RB: [
        "name",
        "position",
        "team",
        "targets",
        "receptions",
        "receiving_yards",
        "receiving_tds",
        "carries",
        "rushing_yards",
        "rushing_tds",
        "target_share",
        "red_zone_target_share",
        "red_zone_rushes"
    ],

    WR: [
        "name",
        "position",
        "team",
        "targets",
        "receptions",
        "receiving_yards",
        "receiving_tds",
        "target_share",
        "red_zone_target_share"
    ],

    TE: [
        "name",
        "position",
        "team",
        "targets",
        "receptions",
        "receiving_yards",
        "receiving_tds",
        "target_share",
        "red_zone_target_share"
    ]

};


/* =========================================================
   HELPERS
   ========================================================= */

function esc(value) {

    return String(value ?? "").replace(
        /[&<>"']/g,
        function(m) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[m];
        }
    );

}


function numberValue(value) {

    const n = Number(value);

    return Number.isFinite(n) ? n : 0;

}


function formatPercent(value) {

    return numberValue(value).toFixed(1) + "%";

}


function displayValue(player, column) {

    if (column.type === "percent") {

        return formatPercent(
            player[column.key]
        );

    }

    if (column.type === "number") {

        return numberValue(
            player[column.key]
        );

    }

    return esc(
        player[column.key] || ""
    );

}


function getSortValue(player, column) {

    if (
        column.type === "number" ||
        column.type === "percent"
    ) {

        return numberValue(
            player[column.key]
        );

    }

    return String(
        player[column.key] || ""
    ).toLowerCase();

}


/* =========================================================
   SORT
   ========================================================= */

function sortRows(rows) {

    const column = COLUMNS.find(
        function(c) {
            return c.key === currentSort;
        }
    );

    if (!column) {
        return rows;
    }

    rows.sort(function(a, b) {

        const aValue = getSortValue(a, column);
        const bValue = getSortValue(b, column);

        if (column.type === "text") {

            const result =
                aValue.localeCompare(bValue);

            return sortDirection === "asc"
                ? result
                : -result;
        }

        if (aValue === bValue) {

            return String(a.name || "")
                .localeCompare(
                    String(b.name || "")
                );

        }

        return sortDirection === "desc"
            ? bValue - aValue
            : aValue - bValue;

    });

    return rows;

}


function sortArrow(key) {

    if (currentSort !== key) {
        return "";
    }

    return sortDirection === "desc"
        ? " ↓"
        : " ↑";

}


/* =========================================================
   TEAMS
   ========================================================= */

function populateTeams() {

    const teams = [
        ...new Set(
            DATA
                .map(function(player) {
                    return player.team;
                })
                .filter(Boolean)
        )
    ].sort();

    teams.forEach(function(teamCode) {

        const option =
            document.createElement("option");

        option.value = teamCode;
        option.textContent = teamCode;

        team.appendChild(option);

    });

}


/* =========================================================
   VISIBLE COLUMNS
   ========================================================= */

function getVisibleColumns() {

    const keys =
        POSITION_COLUMNS[position.value] ||
        POSITION_COLUMNS.ALL;

    return COLUMNS.filter(function(column) {

        return keys.includes(column.key);

    });

}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

    const q =
        search.value.trim().toLowerCase();

    const pos = position.value;

    const selectedTeam = team.value;


    let rows = DATA.filter(function(player) {

        const playerName =
            String(player.name || "")
                .toLowerCase();

        const matchesSearch =
            !q ||
            playerName.includes(q);

        const matchesPosition =
            pos === "ALL" ||
            player.position === pos;

        const matchesTeam =
            selectedTeam === "ALL" ||
            player.team === selectedTeam;

        return (
            matchesSearch &&
            matchesPosition &&
            matchesTeam
        );

    });


    const visibleColumns =
        getVisibleColumns();


    /* Make sure sort column is visible */

    const sortVisible =
        visibleColumns.some(function(column) {

            return column.key === currentSort;

        });


    if (!sortVisible) {

        const numericColumn =
            visibleColumns.find(function(column) {

                return (
                    column.type === "number" ||
                    column.type === "percent"
                );

            });

        if (numericColumn) {

            currentSort =
                numericColumn.key;

            sortDirection = "desc";

        } else {

            currentSort = "name";
            sortDirection = "asc";

        }

    }


    sortRows(rows);


    if (!rows.length) {

        table.innerHTML = `
            <div style="
                padding:20px;
                color:#9aa6b2
            ">
                No players match your filters.
            </div>
        `;

        return;

    }


    let html = `
        <table>
            <thead>
                <tr>
                    <th class="rank">#</th>
    `;


    visibleColumns.forEach(function(column) {

        html += `
            <th>
                <button
                    class="sort-button"
                    data-sort="${column.key}"
                >
                    ${column.label}${sortArrow(column.key)}
                </button>
            </th>
        `;

    });


    html += `
                </tr>
            </thead>
            <tbody>
    `;


    rows.forEach(function(player, index) {

        html += `
            <tr>

                <td class="rank">
                    ${index + 1}
                </td>
        `;


        visibleColumns.forEach(function(column) {

            if (column.key === "name") {

                html += `
                    <td>

                        <a
                            class="link"
                            href="player.html?id=${encodeURIComponent(player.player_id)}"
                        >
                            ${esc(player.name)}
                        </a>

                        <span class="meta">
                            ${esc(player.position)}
                            ·
                            ${esc(player.team || "")}
                        </span>

                    </td>
                `;

            } else {

                html += `
                    <td>
                        ${displayValue(player, column)}
                    </td>
                `;

            }

        });


        html += `
            </tr>
        `;

    });


    html += `
            </tbody>
        </table>
    `;


    table.innerHTML = html;


    document
        .querySelectorAll(".sort-button")
        .forEach(function(button) {

            button.addEventListener(
                "click",
                function() {

                    const key =
                        button.dataset.sort;

                    if (currentSort === key) {

                        sortDirection =
                            sortDirection === "desc"
                                ? "asc"
                                : "desc";

                    } else {

                        currentSort = key;

                        const column =
                            COLUMNS.find(
                                function(c) {
                                    return c.key === key;
                                }
                            );

                        sortDirection =
                            column.type === "text"
                                ? "asc"
                                : "desc";

                    }

                    render();

                }
            );

        });

}


/* =========================================================
   EVENTS
   ========================================================= */

search.addEventListener(
    "input",
    render
);

position.addEventListener(
    "change",
    render
);

team.addEventListener(
    "change",
    render
);


/* =========================================================
   LOAD DATA
   ========================================================= */

fetch("data/players.json")

.then(function(response) {

    if (!response.ok) {

        throw new Error(
            "HTTP " + response.status
        );

    }

    return response.json();

})

.then(function(data) {

    DATA =
        Array.isArray(data)
            ? data
            : (data.players || []);

    document.getElementById(
        "season"
    ).textContent =
        (data.season || "") +
        " Season";

    populateTeams();

    render();

})

.catch(function(error) {

    console.error(error);

    table.innerHTML = `
        <div style="
            padding:20px;
            color:#ff6b6b
        ">
            Unable to load player data:
            ${esc(error.message)}
        </div>
    `;

});

</script>

</body>
</html>
