<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Analytics — Players</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="site">

    <div class="brand">
        <h1>NFL Analytics</h1>
        <div class="season" id="season"></div>
    </div>

    <nav class="mainnav">
        <a href="league.html">LEAGUE</a>
        <a class="active" href="players.html">PLAYERS</a>
        <a href="teams.html">TEAMS</a>
    </nav>

    <div class="controls">

        <input
            id="search"
            class="search"
            placeholder="Search players..."
            autocomplete="off"
            style="flex:1;min-width:180px;"
        >

        <select id="position" class="filter">
            <option value="ALL">All positions</option>
            <option value="QB">QB</option>
            <option value="RB">RB</option>
            <option value="WR">WR</option>
            <option value="TE">TE</option>
        </select>

        <select id="team" class="filter">
            <option value="ALL">All teams</option>
        </select>

    </div>

    <section class="panel">

        <div class="panelhead">

            <h2>Players</h2>

            <div class="note">
                Click a column header to sort
            </div>

        </div>

        <div id="table"></div>

    </section>

    <div class="footer">
        Click a player for detail • Click column headers to sort
    </div>

</div>


<script>

let DATA = [];

let currentSort = "targets";

let sortDirection = "desc";


const search =
    document.getElementById("search");

const position =
    document.getElementById("position");

const team =
    document.getElementById("team");

const table =
    document.getElementById("table");


const COLUMNS = [

    {
        key: "name",
        label: "Player",
        type: "text"
    },

    {
        key: "position",
        label: "Position",
        type: "text"
    },

    {
        key: "team",
        label: "Team",
        type: "text"
    },

    {
        key: "targets",
        label: "Targets",
        type: "number"
    },

    {
        key: "receptions",
        label: "Receptions",
        type: "number"
    },

    {
        key: "receiving_yards",
        label: "Receiving Yards",
        type: "number"
    },

    {
        key: "receiving_tds",
        label: "Receiving TDs",
        type: "number"
    },

    {
        key: "carries",
        label: "Carries",
        type: "number"
    },

    {
        key: "rushing_yards",
        label: "Rushing Yards",
        type: "number"
    },

    {
        key: "rushing_tds",
        label: "Rushing TDs",
        type: "number"
    },

    {
        key: "target_share",
        label: "Target Share",
        type: "percent"
    },

    {
        key: "red_zone_target_share",
        label: "RZ Target Share",
        type: "percent"
    },

    {
        key: "red_zone_rushes",
        label: "RZ Rushes",
        type: "number"
    }

];


/*
 * Which columns should be visible for each position.
 *
 * ALL = everything
 *
 * QB = passing/usage + rushing
 *
 * RB = rushing + receiving
 *
 * WR/TE = receiving + red zone receiving
 */

const POSITION_COLUMNS = {

    ALL: [
        "name",
        "position",
        "team",
        "targets",
        "receptions",
        "receiving_yards",
        "receiving_tds",
        "carries",
        "rushing_yards",
        "rushing_tds",
        "target_share",
        "red_zone_target_share",
        "red_zone_rushes"
    ],

    QB: [
        "name",
        "position",
        "team",
        "carries",
        "rushing_yards",
        "rushing_tds",
        "red_zone_rushes"
    ],

    RB: [
        "name",
        "position",
        "team",
        "targets",
        "receptions",
        "receiving_yards",
        "receiving_tds",
        "carries",
        "rushing_yards",
        "rushing_tds",
        "target_share",
        "red_zone_target_share",
        "red_zone_rushes"
    ],

    WR: [
        "name",
        "position",
        "team",
        "targets",
        "receptions",
        "receiving_yards",
        "receiving_tds",
        "target_share",
        "red_zone_target_share"
    ],

    TE: [
        "name",
        "position",
        "team",
        "targets",
        "receptions",
        "receiving_yards",
        "receiving_tds",
        "target_share",
        "red_zone_target_share"
    ]

};


function esc(value) {

    return String(value ?? "").replace(
        /[&<>"']/g,
        m => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[m])
    );

}


function numberValue(value) {

    const n = Number(value);

    return Number.isFinite(n) ? n : 0;

}


function formatPercent(value) {

    const n = numberValue(value);

    return n.toFixed(1) + "%";

}


function displayValue(player, column) {

    const value =
        player[column.key];

    if (column.type === "percent") {

        return formatPercent(value);

    }

    if (column.type === "number") {

        return numberValue(value);

    }

    return esc(value || "");

}


function getSortValue(player, column) {

    if (
        column.type === "number" ||
        column.type === "percent"
    ) {

        return numberValue(
            player[column.key]
        );

    }

    return String(
        player[column.key] || ""
    ).toLowerCase();

}


function sortRows(rows) {

    const column =
        COLUMNS.find(
            c => c.key === currentSort
        );

    if (!column) {
        return rows;
    }


    rows.sort((a, b) => {

        const aValue =
            getSortValue(a, column);

        const bValue =
            getSortValue(b, column);


        if (column.type === "text") {

            const result =
                aValue.localeCompare(bValue);

            return sortDirection === "asc"
                ? result
                : -result;

        }


        if (aValue === bValue) {

            return String(a.name || "")
                .localeCompare(
                    String(b.name || "")
                );

        }


        return sortDirection === "desc"
            ? bValue - aValue
            : aValue - bValue;

    });


    return rows;

}


function sortArrow(key) {

    if (currentSort !== key) {
        return "";
    }

    return sortDirection === "desc"
        ? " ↓"
        : " ↑";

}


function populateTeams() {

    const teams =
        [...new Set(
            DATA
                .map(player => player.team)
                .filter(Boolean)
        )]
        .sort();


    teams.forEach(teamCode => {

        const option =
            document.createElement("option");

        option.value = teamCode;

        option.textContent = teamCode;

        team.appendChild(option);

    });

}


function getVisibleColumns() {

    const pos =
        position.value;

    const keys =
        POSITION_COLUMNS[pos] ||
        POSITION_COLUMNS.ALL;


    return COLUMNS.filter(
        column =>
            keys.includes(column.key)
    );

}


function render() {

    const q =
        search.value.trim().toLowerCase();

    const pos =
        position.value;

    const selectedTeam =
        team.value;


    let rows = DATA.filter(player => {

        const name =
            String(player.name || "")
                .toLowerCase();


        const matchesSearch =
            !q ||
            name.includes(q);


        const matchesPosition =
            pos === "ALL" ||
            player.position === pos;


        const matchesTeam =
            selectedTeam === "ALL" ||
            player.team === selectedTeam;


        return (
            matchesSearch &&
            matchesPosition &&
            matchesTeam
        );

    });


    const visibleColumns =
        getVisibleColumns();


    /*
     * If the currently selected sort column
     * is hidden for this position, default
     * to the first useful numeric column.
     */

    const sortStillVisible =
        visibleColumns.some(
            column =>
                column.key === currentSort
        );


    if (!sortStillVisible) {

        const firstNumeric =
            visibleColumns.find(
                column =>
                    column.type === "number" ||
                    column.type === "percent"
            );


        if (firstNumeric) {

            currentSort =
                firstNumeric.key;

            sortDirection = "desc";

        } else {

            currentSort =
                "name";

            sortDirection = "asc";

        }

    }


    sortRows(rows);


    if (!rows.length) {

        table.innerHTML = `
            <div style="
                padding:20px;
                color:#9aa6b2
            ">
                No players match your filters.
            </div>
        `;

        return;

    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th class="rank">
                        #
                    </th>

    `;


    visibleColumns.forEach(column => {

        html += `

            <th>

                <button
                    class="sort-button"
                    data-sort="${column.key}"
                >
                    ${column.label}${sortArrow(column.key)}
                </button>

            </th>

        `;

    });


    html += `

                </tr>

            </thead>

            <tbody>

    `;


    rows.forEach((player, index) => {

        html += `

            <tr>

                <td class="rank">
                    ${index + 1}
                </td>

        `;


        visibleColumns.forEach(column => {

            if (column.key === "name") {

                html += `

                    <td>

                        <a
                            class="link"
                            href="player.html?id=${encodeURIComponent(player.player_id)}"
                        >
                            ${esc(player.name)}
                        </a>

                        <span class="meta">
                            ${esc(player.position)}
                            ·
                            ${esc(player.team || "")}
                        </span>

                    </td>

                `;

            } else {

                html += `

                    <td>
                        ${displayValue(
                            player,
                            column
                        )}
                    </td>

                `;

            }

        });


        html += `

            </tr>

        `;

    });


    html += `

            </tbody>

        </table>

    `;


    table.innerHTML = html;


    document
        .querySelectorAll(".sort-button")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const key =
                        button.dataset.sort;


                    if (currentSort === key) {

                        sortDirection =
                            sortDirection === "desc"
                                ? "asc"
                                : "desc";

                    } else {

                        currentSort = key;

                        const column =
                            COLUMNS.find(
                                c => c.key === key
                            );

                        sortDirection =
                            column.type === "text"
                                ? "asc"
                                : "desc";

                    }


                    render();

                }
            );

        });

}


search.addEventListener(
    "input",
    render
);


position.addEventListener(
    "change",
    render
);


team.addEventListener(
    "change",
    render
);


fetch("data/players.json")

.then(response => {

    if (!response.ok) {

        throw new Error(
            "HTTP " + response.status
        );

    }

    return response.json();

})

.then(data => {

    DATA =
        Array.isArray(data)
            ? data
            : (data.players || []);


    document.getElementById(
        "season"
    ).textContent =
        (data.season || "") +
        " Season";


    populateTeams();

    render();

})

.catch(error => {

    console.error(error);

    table.innerHTML = `

        <div style="
            padding:20px;
            color:#ff6b6b
        ">

            Unable to load player data:
            ${esc(error.message)}

        </div>

    `;

});

</script>

</body>
</html>
