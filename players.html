<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>StackTheStats | Players</title>

<style>
:root{
    --bg:#080c12;
    --panel:#101722;
    --panel2:#151e2b;
    --text:#f4f7fb;
    --muted:#9aa6b2;
    --line:#27313d;
    --accent:#58a6ff;
    --accent2:#79b8ff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top left,rgba(88,166,255,.08),transparent 30%),
        var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:32px 28px 55px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
    margin-bottom:18px;
}

header h1{
    margin:0;
    font-size:32px;
    letter-spacing:-.5px;
}

.season{
    color:var(--muted);
    font-size:14px;
}

.mainnav{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
}

.mainnav a{
    color:var(--muted);
    text-decoration:none;
    font-weight:700;
    padding:12px 15px;
    border-bottom:2px solid transparent;
    transition:.15s;
}

.mainnav a:hover{
    color:var(--text);
}

.mainnav a.active{
    color:var(--text);
    border-bottom-color:var(--accent);
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:16px;
}

.search,
select{
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px;
}

.search{
    flex:1;
    min-width:220px;
}

select{
    min-width:150px;
}

.panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    overflow-x:auto;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
}

.panel-head{
    padding:18px;
    border-bottom:1px solid var(--line);
}

.panel-head h2{
    margin:0;
}

.panel-head p{
    margin:5px 0 0;
    color:var(--muted);
    font-size:13px;
}

table{
    width:100%;
    min-width:1050px;
    border-collapse:collapse;
}

th,
td{
    padding:13px 15px;
    text-align:left;
    border-bottom:1px solid var(--line);
}

th{
    color:var(--muted);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.4px;
}

tbody tr:hover{
    background:rgba(88,166,255,.045);
}

.player-link{
    color:var(--text);
    text-decoration:none;
    font-weight:700;
}

.player-link:hover{
    color:var(--accent);
}

.meta{
    display:block;
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

.rank{
    color:var(--muted);
    width:55px;
}

.share{
    min-width:170px;
}

.bar{
    height:5px;
    background:#252f3b;
    border-radius:99px;
    margin-top:7px;
    overflow:hidden;
}

.bar i{
    display:block;
    height:100%;
    background:var(--accent);
}

.message{
    padding:25px;
    color:var(--muted);
    text-align:center;
}

.footer{
    color:var(--muted);
    text-align:center;
    padding:28px 0 0;
    font-size:13px;
}

@media(max-width:650px){

    .container{
        padding:22px 18px 40px;
    }

    header{
        align-items:flex-start;
        flex-direction:column;
        gap:5px;
    }

    header h1{
        font-size:27px;
    }

    .mainnav a{
        padding:11px 10px;
        font-size:13px;
    }

    th,
    td{
        padding:11px 10px;
        font-size:13px;
    }

    table{
        min-width:1050px;
    }
}
</style>

</head>

<body>

<div class="container">

<header>
    <div>
        <h1>StackTheStats</h1>
    </div>

    <div class="season" id="seasonLabel">
        2026 NFL Season
    </div>
</header>

<nav class="mainnav">
    <a href="index.html">HOME</a>
    <a href="league.html">LEAGUE</a>
    <a class="active" href="players.html">PLAYERS</a>
    <a href="teams.html">TEAMS</a>
</nav>

<div class="controls">
    <input
        id="search"
        class="search"
        type="text"
        placeholder="Search players..."
    >

    <select id="positionFilter">
        <option value="ALL">All Positions</option>
        <option value="QB">QB</option>
        <option value="WR">WR</option>
        <option value="RB">RB</option>
        <option value="TE">TE</option>
    </select>

    <select id="teamFilter">
        <option value="ALL">All Teams</option>
    </select>
</div>

<section class="panel">

    <div class="panel-head">
        <h2>Players</h2>
        <p>2026 regular-season player usage</p>
    </div>

    <div id="tableWrap">
        <div class="message">
            Loading player data...
        </div>
    </div>

</section>

<div class="footer">
    StackTheStats · NFL Analytics · Built on the numbers.
</div>

</div>

<script>

let players = [];

const searchInput = document.getElementById("search");
const positionFilter = document.getElementById("positionFilter");
const teamFilter = document.getElementById("teamFilter");
const tableWrap = document.getElementById("tableWrap");
const seasonLabel = document.getElementById("seasonLabel");

function formatPercentage(value){

    const number = Number(value);

    if(!Number.isFinite(number)){
        return "0.00%";
    }

    return number.toFixed(2) + "%";
}

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function playerName(player){

    return player.player_display_name ||
           player.player_name ||
           player.name ||
           "Unknown";
}

function playerId(player){

    return player.player_id ||
           player.gsis_id ||
           "";
}

function teamName(player){

    return player.team || "";
}

function getTargetShare(player){

    const value = Number(player.target_share);

    if(!Number.isFinite(value)){
        return 0;
    }

    return value <= 1 ? value * 100 : value;
}

function getRzTargetShare(player){

    const value = Number(player.red_zone_target_share);

    if(!Number.isFinite(value)){
        return 0;
    }

    return value <= 1 ? value * 100 : value;
}

function render(){

    const search = searchInput.value.trim().toLowerCase();
    const position = positionFilter.value;
    const team = teamFilter.value;

    let filtered = players.filter(player => {

        const name = playerName(player).toLowerCase();

        const matchesSearch =
            !search ||
            name.includes(search);

        const matchesPosition =
            position === "ALL" ||
            player.position === position;

        const matchesTeam =
            team === "ALL" ||
            teamName(player) === team;

        return matchesSearch &&
               matchesPosition &&
               matchesTeam;
    });

    filtered.sort((a,b) => {

        const aTargets = Number(a.targets) || 0;
        const bTargets = Number(b.targets) || 0;

        return bTargets - aTargets;
    });

    if(!filtered.length){

        tableWrap.innerHTML = `
            <div class="message">
                No players found.
            </div>
        `;

        return;
    }

    tableWrap.innerHTML = `

        <table>

            <thead>

                <tr>
                    <th>#</th>
                    <th>Player</th>
                    <th>Pos</th>
                    <th>Team</th>
                    <th>Targets</th>
                    <th>Target Share</th>
                    <th>Carries</th>
                    <th>Receptions</th>
                    <th>RZ Targets</th>
                    <th>RZ Target Share</th>
                </tr>

            </thead>

            <tbody>

                ${filtered.map((player,index) => {

                    const targetShare = getTargetShare(player);
                    const rzShare = getRzTargetShare(player);

                    return `

                    <tr>

                        <td class="rank">
                            ${index + 1}
                        </td>

                        <td>
                            <a
                                class="player-link"
                                href="player.html?id=${encodeURIComponent(playerId(player))}"
                            >
                                ${escapeHtml(playerName(player))}
                            </a>

                            <span class="meta">
                                View player profile
                            </span>
                        </td>

                        <td>
                            ${escapeHtml(player.position || "")}
                        </td>

                        <td>
                            ${escapeHtml(teamName(player))}
                        </td>

                        <td>
                            ${Number(player.targets) || 0}
                        </td>

                        <td class="share">

                            ${formatPercentage(targetShare)}

                            <div class="bar">
                                <i style="width:${Math.min(targetShare,100)}%"></i>
                            </div>

                        </td>

                        <td>
                            ${Number(player.carries) || 0}
                        </td>

                        <td>
                            ${Number(player.receptions) || 0}
                        </td>

                        <td>
                            ${Number(player.red_zone_targets) || 0}
                        </td>

                        <td class="share">

                            ${formatPercentage(rzShare)}

                            <div class="bar">
                                <i style="width:${Math.min(rzShare,100)}%"></i>
                            </div>

                        </td>

                    </tr>

                    `;

                }).join("")}

            </tbody>

        </table>
    `;
}

async function loadPlayers(){

    try{

        const response = await fetch(
            "data/players.json?v=" + Date.now()
        );

        if(!response.ok){
            throw new Error("Failed to load player data");
        }

        const data = await response.json();

        players = Array.isArray(data)
            ? data
            : (data.players || []);

        if(data.season){
            seasonLabel.textContent =
                data.season + " NFL Season";
        }

        const teams = [...new Set(
            players
                .map(player => teamName(player))
                .filter(Boolean)
        )].sort();

        teams.forEach(team => {

            const option = document.createElement("option");

            option.value = team;
            option.textContent = team;

            teamFilter.appendChild(option);
        });

        render();

    }catch(error){

        console.error(error);

        tableWrap.innerHTML = `
            <div class="message">
                Unable to load player data.
            </div>
        `;
    }
}

searchInput.addEventListener("input",render);
positionFilter.addEventListener("change",render);
teamFilter.addEventListener("change",render);

loadPlayers();

</script>

</body>
</html>
