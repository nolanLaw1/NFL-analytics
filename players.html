<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>StackTheStats | Players</title>

<link rel="stylesheet" href="styles.css">

<style>

/* =========================
   PAGE HEADER
========================= */

.page-header {
    margin-bottom: 20px;
}

.page-header h1 {
    margin: 0 0 6px 0;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -.7px;
}

.season {
    color: var(--muted);
    font-size: 14px;
}

/* =========================
   NAVIGATION
========================= */

.mainnav {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
}

.mainnav a {
    color: var(--muted);
    background: transparent;
    text-decoration: none;
    font-weight: 700;
    padding: 12px 15px;
    transition: color .2s ease, border-color .2s ease;
}

.mainnav a:hover {
    color: var(--text);
    text-decoration: none;
}

.mainnav a.active {
    color: var(--text);
    border-bottom: 2px solid var(--accent);
}

/* =========================
   CONTROLS
========================= */

.controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
}

.search,
.filter {
    box-sizing: border-box;
    min-height: 44px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 14px;
}

.search::placeholder {
    color: var(--muted);
}

.search:focus,
.filter:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(88,166,255,.10);
}

.filter {
    min-width: 150px;
}

/* =========================
   PANEL
========================= */

.panel {
    background:
        linear-gradient(
            145deg,
            rgba(16,23,34,.98),
            rgba(21,30,43,.98)
        );

    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 28px rgba(0,0,0,.16);
}

.panelhead {
    padding: 19px 20px;
    border-bottom: 1px solid var(--line);

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

.panelhead h2 {
    margin: 0;
    font-size: 20px;
}

.note {
    color: var(--muted);
    font-size: 13px;
}

/* =========================
   TABLE
========================= */

#table {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1050px;
}

th,
td {
    padding: 13px 15px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
}

th {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .6px;
    text-align: left;
    background: var(--panel2);
}

td {
    font-size: 14px;
}

tbody tr {
    transition: background .15s ease;
}

tbody tr:hover {
    background: rgba(88,166,255,.035);
}

tbody tr:last-child td {
    border-bottom: none;
}

.rank {
    width: 45px;
    color: var(--muted);
    font-weight: 700;
}

/* =========================
   SORT BUTTON
========================= */

.sort-button {
    border: none;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .6px;
    padding: 0;
    cursor: pointer;
}

.sort-button:hover {
    color: var(--text);
}

/* =========================
   PLAYER
========================= */

.link {
    color: var(--text);
    text-decoration: none;
    font-weight: 700;
}

.link:hover {
    color: var(--accent2);
}

.meta {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
}

/* =========================
   FOOTER
========================= */

.footer {
    color: var(--muted);
    text-align: center;
    padding: 28px 0;
    font-size: 13px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .page-header h1 {
        font-size: 27px;
    }

    .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .search {
        grid-column: 1 / -1;
        width: 100% !important;
    }

    .filter {
        width: 100%;
        min-width: 0;
    }

    .panelhead {
        display: block;
    }

    .note {
        margin-top: 5px;
    }

    table {
        min-width: 1050px;
    }

}

</style>

</head>

<body>

<div class="site">

    <div class="page-header">

        <h1>StackTheStats</h1>

        <div class="season" id="season"></div>

    </div>

    <nav class="mainnav">

        <a href="index.html">HOME</a>

        <a href="league.html">LEAGUE</a>

        <a class="active" href="players.html">PLAYERS</a>

        <a href="teams.html">TEAMS</a>

    </nav>

    <div class="controls">

        <input
            id="search"
            class="search"
            placeholder="Search players..."
            autocomplete="off"
            style="flex:1;min-width:180px;"
        >

        <select id="position" class="filter">
            <option value="ALL">All positions</option>
            <option value="QB">QB</option>
            <option value="RB">RB</option>
            <option value="WR">WR</option>
            <option value="TE">TE</option>
        </select>

        <select id="team" class="filter">
            <option value="ALL">All teams</option>
        </select>

    </div>

    <section class="panel">

        <div class="panelhead">

            <h2>Players</h2>

            <div class="note">
                Click a column header to sort
            </div>

        </div>

        <div id="table"></div>

    </section>

    <div class="footer">
        StackTheStats · NFL Analytics · Built on the numbers.
    </div>

</div>

<script>

let DATA = [];

let currentSort = "targets";
let sortDirection = "desc";

const search = document.getElementById("search");
const position = document.getElementById("position");
const team = document.getElementById("team");
const table = document.getElementById("table");

const COLUMNS = [

    {
        key: "name",
        label: "Player",
        type: "text"
    },

    {
        key: "position",
        label: "Position",
        type: "text"
    },

    {
        key: "team",
        label: "Team",
        type: "text"
    },

    {
        key: "pass_attempts",
        label: "Pass Attempts",
        type: "number"
    },

    {
        key: "completions",
        label: "Completions",
        type: "number"
    },

    {
        key: "completion_pct",
        label: "Completion %",
        type: "percent"
    },

    {
        key: "passing_yards",
        label: "Passing Yards",
        type: "number"
    },

    {
        key: "passing_tds",
        label: "Passing TDs",
        type: "number"
    },

    {
        key: "interceptions",
        label: "INT",
        type: "number"
    },

    {
        key: "yards_per_attempt",
        label: "Yards/Attempt",
        type: "number"
    },

    {
        key: "red_zone_pass_attempts",
        label: "RZ Pass Attempts",
        type: "number"
    },

    {
        key: "targets",
        label: "Targets",
        type: "number"
    },

    {
        key: "receptions",
        label: "Receptions",
        type: "number"
    },

    {
        key: "receiving_yards",
        label: "Receiving Yards",
        type: "number"
    },

    {
        key: "receiving_tds",
        label: "Receiving TDs",
        type: "number"
    },

    {
        key: "carries",
        label: "Carries",
        type: "number"
    },

    {
        key: "rushing_yards",
        label: "Rushing Yards",
        type: "number"
    },

    {
        key: "rushing_tds",
        label: "Rushing TDs",
        type: "number"
    },

    {
        key: "target_share",
        label: "Target Share",
        type: "percent"
    },

    {
        key: "red_zone_target_share",
        label: "RZ Target Share",
        type: "percent"
    },

    {
        key: "red_zone_rushes",
        label: "RZ Rushes",
        type: "number"
    },

    {
        key: "red_zone_rush_share",
        label: "RZ Rush Share",
        type: "percent"
    }

];

const POSITION_COLUMNS = {

    ALL: [
        "name",
        "position",
        "team",
        "targets",
        "receptions",
        "receiving_yards",
        "receiving_tds",
        "carries",
        "rushing_yards",
        "rushing_tds",
        "target_share",
        "red_zone_target_share",
        "red_zone_rushes"
    ],

    QB: [
        "name",
        "position",
        "team",
        "pass_attempts",
        "completions",
        "completion_pct",
        "passing_yards",
        "passing_tds",
        "interceptions",
        "yards_per_attempt",
        "red_zone_pass_attempts",
        "carries",
        "rushing_yards",
        "rushing_tds",
        "red_zone_rushes",
        "red_zone_rush_share"
    ],

    RB: [
        "name",
        "position",
        "team",
        "targets",
        "receptions",
        "receiving_yards",
        "receiving_tds",
        "carries",
        "rushing_yards",
        "rushing_tds",
        "target_share",
        "red_zone_target_share",
        "red_zone_rushes",
        "red_zone_rush_share"
    ],

    WR: [
        "name",
        "position",
        "team",
        "targets",
        "receptions",
        "receiving_yards",
        "receiving_tds",
        "target_share",
        "red_zone_target_share"
    ],

    TE: [
        "name",
        "position",
        "team",
        "targets",
        "receptions",
        "receiving_yards",
        "receiving_tds",
        "target_share",
        "red_zone_target_share"
    ]

};

function esc(value) {

    return String(value ?? "").replace(
        /[&<>"']/g,
        function(m) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[m];
        }
    );

}

function numberValue(value) {

    const n = Number(value);

    return Number.isFinite(n) ? n : 0;

}

function formatPercent(value) {

    return numberValue(value).toFixed(1) + "%";

}

function displayValue(player, column) {

    if (column.type === "percent") {

        return formatPercent(
            player[column.key]
        );

    }

    if (column.type === "number") {

        return numberValue(
            player[column.key]
        );

    }

    return esc(
        player[column.key] || ""
    );

}

function getSortValue(player, column) {

    if (
        column.type === "number" ||
        column.type === "percent"
    ) {

        return numberValue(
            player[column.key]
        );

    }

    return String(
        player[column.key] || ""
    ).toLowerCase();

}

function sortRows(rows) {

    const column = COLUMNS.find(
        function(c) {
            return c.key === currentSort;
        }
    );

    if (!column) {
        return rows;
    }

    rows.sort(function(a, b) {

        const aValue = getSortValue(a, column);
        const bValue = getSortValue(b, column);

        if (column.type === "text") {

            const result =
                aValue.localeCompare(bValue);

            return sortDirection === "asc"
                ? result
                : -result;
        }

        if (aValue === bValue) {

            return String(a.name || "")
                .localeCompare(
                    String(b.name || "")
                );

        }

        return sortDirection === "desc"
            ? bValue - aValue
            : aValue - bValue;

    });

    return rows;

}

function sortArrow(key) {

    if (currentSort !== key) {
        return "";
    }

    return sortDirection === "desc"
        ? " ↓"
        : " ↑";

}

function populateTeams() {

    const teams = [
        ...new Set(
            DATA
                .map(function(player) {
                    return player.team;
                })
                .filter(Boolean)
        )
    ].sort();

    teams.forEach(function(teamCode) {

        const option =
            document.createElement("option");

        option.value = teamCode;
        option.textContent = teamCode;

        team.appendChild(option);

    });

}

function getVisibleColumns() {

    const keys =
        POSITION_COLUMNS[position.value] ||
        POSITION_COLUMNS.ALL;

    return COLUMNS.filter(function(column) {

        return keys.includes(column.key);

    });

}

function render() {

    const q =
        search.value.trim().toLowerCase();

    const pos = position.value;

    const selectedTeam = team.value;

    let rows = DATA.filter(function(player) {

        const playerName =
            String(player.name || "")
                .toLowerCase();

        const matchesSearch =
            !q ||
            playerName.includes(q);

        const matchesPosition =
            pos === "ALL" ||
            player.position === pos;

        const matchesTeam =
            selectedTeam === "ALL" ||
            player.team === selectedTeam;

        return (
            matchesSearch &&
            matchesPosition &&
            matchesTeam
        );

    });

    const visibleColumns =
        getVisibleColumns();

    const sortVisible =
        visibleColumns.some(function(column) {

            return column.key === currentSort;

        });

    if (!sortVisible) {

        const numericColumn =
            visibleColumns.find(function(column) {

                return (
                    column.type === "number" ||
                    column.type === "percent"
                );

            });

        if (numericColumn) {

            currentSort =
                numericColumn.key;

            sortDirection = "desc";

        } else {

            currentSort = "name";
            sortDirection = "asc";

        }

    }

    sortRows(rows);

    if (!rows.length) {

        table.innerHTML = `
            <div style="
                padding:20px;
                color:#9aa6b2
            ">
                No players match your filters.
            </div>
        `;

        return;

    }

    let html = `
        <table>
            <thead>
                <tr>
                    <th class="rank">#</th>
    `;

    visibleColumns.forEach(function(column) {

        html += `
            <th>
                <button
                    class="sort-button"
                    data-sort="${column.key}"
                >
                    ${column.label}${sortArrow(column.key)}
                </button>
            </th>
        `;

    });

    html += `
                </tr>
            </thead>
            <tbody>
    `;

    rows.forEach(function(player, index) {

        html += `
            <tr>

                <td class="rank">
                    ${index + 1}
                </td>
        `;

        visibleColumns.forEach(function(column) {

            if (column.key === "name") {

                html += `
                    <td>

                        <a
                            class="link"
                            href="player.html?id=${encodeURIComponent(player.player_id)}"
                        >
                            ${esc(player.name)}
                        </a>

                        <span class="meta">
                            ${esc(player.position)}
                            ·
                            ${esc(player.team || "")}
                        </span>

                    </td>
                `;

            } else {

                html += `
                    <td>
                        ${displayValue(player, column)}
                    </td>
                `;

            }

        });

        html += `
            </tr>
        `;

    });

    html += `
            </tbody>
        </table>
    `;

    table.innerHTML = html;

    document
        .querySelectorAll(".sort-button")
        .forEach(function(button) {

            button.addEventListener(
                "click",
                function() {

                    const key =
                        button.dataset.sort;

                    if (currentSort === key) {

                        sortDirection =
                            sortDirection === "desc"
                                ? "asc"
                                : "desc";

                    } else {

                        currentSort = key;

                        const column =
                            COLUMNS.find(
                                function(c) {
                                    return c.key === key;
                                }
                            );

                        sortDirection =
                            column.type === "text"
                                ? "asc"
                                : "desc";

                    }

                    render();

                }
            );

        });

}

search.addEventListener("input", render);

position.addEventListener("change", render);

team.addEventListener("change", render);

fetch("data/players.json")

.then(function(response) {

    if (!response.ok) {

        throw new Error(
            "HTTP " + response.status
        );

    }

    return response.json();

})

.then(function(data) {

    DATA =
        Array.isArray(data)
            ? data
            : (data.players || []);

    document.getElementById(
        "season"
    ).textContent =
        (data.season || "") +
        " Season";

    populateTeams();

    render();

})

.catch(function(error) {

    console.error(error);

    table.innerHTML = `
        <div style="
            padding:20px;
            color:#ff6b6b
        ">
            Unable to load player data:
            ${esc(error.message)}
        </div>
    `;

});

</script>

</body>
</html>
