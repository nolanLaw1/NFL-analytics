<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Analytics — Team</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="site">

    <div class="brand">

        <h1 id="title">
            TEAM
        </h1>

        <div
            class="season"
            id="season">
        </div>

    </div>


    <nav class="mainnav">

        <a href="league.html">
            LEAGUE
        </a>

        <a href="players.html">
            PLAYERS
        </a>

        <a
            class="active"
            href="teams.html">
            TEAMS
        </a>

    </nav>


    <div id="app"></div>


    <div class="footer">
        NFL offensive tendencies • regular season
    </div>

</div>


<script>

const id =
    new URLSearchParams(
        location.search
    ).get("id");


const app =
    document.getElementById("app");


const title =
    document.getElementById("title");


const season =
    document.getElementById("season");


function esc(value) {

    return String(value ?? "").replace(
        /[&<>"']/g,
        m => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[m])
    );

}


function numberValue(value) {

    const n = Number(value);

    return Number.isFinite(n)
        ? n
        : 0;

}


function pct(value) {

    return (
        numberValue(value) * 100
    ).toFixed(1) + "%";

}


function rateBar(value) {

    const width =
        Math.max(
            0,
            Math.min(
                100,
                numberValue(value) * 100
            )
        );

    return `
        <div class="bar">
            <i style="width:${width}%"></i>
        </div>
    `;

}


function card(label, value) {

    return `

        <div class="card">

            <div class="muted">
                ${esc(label)}
            </div>

            <h2>
                ${pct(value)}
            </h2>

            ${rateBar(value)}

        </div>

    `;

}


function passRun(pass, runs) {

    return `
        ${numberValue(pass)}
        /
        ${numberValue(runs)}
    `;

}


fetch("data/teams.json")

.then(response => {

    if (!response.ok) {

        throw new Error(
            "HTTP " + response.status
        );

    }

    return response.json();

})

.then(data => {

    const teams =
        Array.isArray(data)
            ? data
            : (data.teams || []);


    const team =
        teams.find(
            t => t.team === id
        );


    season.textContent =
        (data.season || "") +
        " Season";


    if (!team) {

        title.textContent =
            "TEAM NOT FOUND";

        app.innerHTML = `

            <div class="panel">

                <div style="padding:20px">

                    Team not found.

                </div>

            </div>

        `;

        return;

    }


    title.textContent =
        team.team;


    app.innerHTML = `

        <section>

            <div class="panelhead">

                <h2>
                    Offensive Tendencies
                </h2>

                <div class="note">
                    Regular season
                </div>

            </div>


            <div
                class="grid"
                style="margin-bottom:28px"
            >

                ${card(
                    "Overall Pass Rate",
                    team.pass_rate
                )}

                ${card(
                    "Red Zone Pass Rate",
                    team.rz_pass_rate
                )}

                ${card(
                    "Trailing Pass Rate",
                    team.trailing_pass_rate
                )}

                ${card(
                    "Leading Pass Rate",
                    team.leading_pass_rate
                )}

                ${card(
                    "2-Minute Pass Rate",
                    team.two_minute_pass_rate
                )}

            </div>

        </section>


        <section>

            <div class="panel">

                <div class="panelhead">

                    <h2>
                        Pass Rate by Down
                    </h2>

                </div>


                <div style="overflow-x:auto">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    Down
                                </th>

                                <th>
                                    Pass Rate
                                </th>

                                <th>
                                    Pass / Run
                                </th>

                            </tr>

                        </thead>

                        <tbody>

                            ${(team.down_splits || [])
                                .map(x => `

                                <tr>

                                    <td>
                                        ${esc(x.down)}
                                    </td>

                                    <td>
                                        ${pct(x.pass_rate)}
                                    </td>

                                    <td>
                                        ${passRun(
                                            x.pass,
                                            x.runs
                                        )}
                                    </td>

                                </tr>

                            `)
                            .join("")}

                        </tbody>

                    </table>

                </div>

            </div>

        </section>


        <section style="margin-top:28px">

            <div class="panel">

                <div class="panelhead">

                    <h2>
                        Weekly Pass Rate
                    </h2>

                </div>


                <div style="overflow-x:auto">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    Week
                                </th>

                                <th>
                                    Pass Rate
                                </th>

                                <th>
                                    Pass / Run
                                </th>

                            </tr>

                        </thead>

                        <tbody>

                            ${(team.weekly || [])
                                .map(x => `

                                <tr>

                                    <td>
                                        ${esc(x.week)}
                                    </td>

                                    <td>
                                        ${pct(x.pass_rate)}
                                    </td>

                                    <td>
                                        ${passRun(
                                            x.pass,
                                            x.runs
                                        )}
                                    </td>

                                </tr>

                            `)
                            .join("")}

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    `;

})

.catch(error => {

    console.error(error);

    app.innerHTML = `

        <div class="panel">

            <div
                style="
                    padding:20px;
                    color:#ff6b6b
                "
            >

                Unable to load team data:
                ${esc(error.message)}

            </div>

        </div>

    `;

});

</script>

</body>
</html>
